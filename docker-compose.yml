version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: shopping-db
    environment:
      POSTGRES_USER: tonigomez
      POSTGRES_PASSWORD: Nostromo.02
      POSTGRES_DB: shoppingDb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - microservices-net

  config-server:
    build:
      context: ./microservice-config
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      - postgres
    networks:
      - microservices-net

  eureka:
    build:
      context: ./microservice-eureka
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      config-server:
       condition: service_started
    networks:
      - microservices-net

  auth-service:
    build:
      context: ./microservice-authenticate
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "9001:9001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shoppingDb
      SPRING_DATASOURCE_USERNAME: tonigomez
      SPRING_DATASOURCE_PASSWORD: Nostromo.02
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      eureka:
        condition: service_started
      postgres:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - microservices-net

  user-service:
    build:
      context: ./microservice-user
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "9002:9002"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shoppingDb
      SPRING_DATASOURCE_USERNAME: tonigomez
      SPRING_DATASOURCE_PASSWORD: Nostromo.02
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - eureka
      - postgres
      - config-server
    networks:
      - microservices-net

  financial-service:
    build:
      context: ./microservice-financial
      dockerfile: Dockerfile
    container_name: financial-service
    ports:
      - "9003:9003"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shoppingDb
      SPRING_DATASOURCE_USERNAME: tonigomez
      SPRING_DATASOURCE_PASSWORD: Nostromo.02
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - eureka
      - postgres
      - config-server
    networks:
      - microservices-net

  gateway:
    build:
      context: ./microservice-gateway
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - eureka
      - auth-service
      - user-service
      - financial-service
    networks:
      - microservices-net

volumes:
  postgres-data:

networks:
  microservices-net:
    driver: bridge
